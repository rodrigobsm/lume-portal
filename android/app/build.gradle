apply plugin: 'com.android.application'

android {
    namespace 'com.travustech.lumeportal'
    compileSdk 29

    defaultConfig {
        applicationId 'com.travustech.lumeportal'
        minSdk 28
        targetSdk 29
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        debug {
            storeFile file('../keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'lumeportal'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
