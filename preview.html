<div id="stage">
  <div class="slide active" id="slideA">
    <div class="photo"></div>
    <div class="panel">
      <div class="src"></div>
      <h1 class="headline"></h1>
      <div class="meta"></div>
      <div class="spacer"></div>
      <div class="clock"></div>
      <div class="date"></div>
      <div class="weather"></div>
      <div class="counter"></div>
    </div>
  </div>
  <div class="slide" id="slideB">
    <div class="photo"></div>
    <div class="panel">
      <div class="src"></div>
      <h1 class="headline"></h1>
      <div class="meta"></div>
      <div class="spacer"></div>
      <div class="clock"></div>
      <div class="date"></div>
      <div class="weather"></div>
      <div class="counter"></div>
    </div>
  </div>
  <div id="offline">
    <div class="clock"></div>
    <div class="date"></div>
    <div class="weather"></div>
    <div class="msg">Sem conexão com as notícias no momento — tentando novamente…</div>
    <div class="brand">PORTAL NEWS</div>
  </div>
</div>
<div id="progress"><div id="bar"></div></div>
<script>
(function () {
  var NEWS_URL = '/api/news';
  var WEATHER_URL = 'https://api.open-meteo.com/v1/forecast?latitude=34.0658&longitude=-84.6769&current=temperature_2m,weather_code&timezone=America%2FNew_York&temperature_unit=fahrenheit';
  var ROTATE_MS = 15000;
  var REFRESH_MS = 600000;
  var WEATHER_MS = 1800000;
  var RETRY_MS = 30000;

  var items = [];
  var index = 0;
  var current = 'A';
  var retryPending = false;
  var slides = { A: document.getElementById('slideA'), B: document.getElementById('slideB') };

  function q(sel, el) { return (el || document).querySelector(sel); }
  function qa(sel, el) { return (el || document).querySelectorAll(sel); }

  function xhrGet(url, cb) {
    var x = new XMLHttpRequest();
    x.open('GET', url, true);
    x.timeout = 20000;
    x.onreadystatechange = function () {
      if (x.readyState === 4) {
        cb(x.status >= 200 && x.status < 300 ? null : new Error('HTTP ' + x.status), x.responseText);
      }
    };
    x.ontimeout = function () { cb(new Error('timeout')); };
    x.onerror = function () { cb(new Error('network')); };
    x.send();
  }

  function catLabel(c) {
    if (c === 'brasil') return 'Brasil';
    if (c === 'mundo') return 'Mundo';
    return 'Tecnologia';
  }

  function fmtTime(iso) {
    if (!iso) return '';
    try {
      var d = new Date(iso);
      return new Intl.DateTimeFormat('pt-BR', {
        timeZone: 'America/New_York', day: '2-digit', month: '2-digit',
        hour: '2-digit', minute: '2-digit'
      }).format(d);
    } catch (e) { return ''; }
  }

  function tickClock() {
    try {
      var now = new Date();
      var time = new Intl.DateTimeFormat('pt-BR', {
        timeZone: 'America/New_York', hour: '2-digit', minute: '2-digit', second: '2-digit'
      }).format(now);
      var date = new Intl.DateTimeFormat('pt-BR', {
        timeZone: 'America/New_York', weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      }).format(now);
      var clocks = qa('.clock');
      var dates = qa('.date');
      for (var i = 0; i < clocks.length; i++) { clocks[i].textContent = time; }
      for (var j = 0; j < dates.length; j++) { dates[j].textContent = date; }
    } catch (e) {}
  }

  function weatherLabel(code) {
    if (code === 0) return 'Céu limpo';
    if (code === 1 || code === 2) return 'Parcialmente nublado';
    if (code === 3) return 'Nublado';
    if (code === 45 || code === 48) return 'Nevoeiro';
    if (code === 51 || code === 53 || code === 55) return 'Garoa';
    if (code === 56 || code === 57) return 'Garoa congelante';
    if (code === 61 || code === 63 || code === 65) return 'Chuva';
    if (code === 66 || code === 67) return 'Chuva congelante';
    if (code === 71 || code === 73 || code === 75) return 'Neve';
    if (code === 77) return 'Grãos de neve';
    if (code === 80 || code === 81 || code === 82) return 'Pancadas de chuva';
    if (code === 85 || code === 86) return 'Pancadas de neve';
    if (code === 95) return 'Trovoada';
    if (code === 96 || code === 99) return 'Trovoada com granizo';
    return 'Acworth, GA';
  }

  function loadWeather() {
    xhrGet(WEATHER_URL, function (err, txt) {
      if (err) return;
      try {
        var j = JSON.parse(txt);
        var c = j.current;
        var f = Math.round(c.temperature_2m);
        var cel = Math.round((f - 32) * 5 / 9);
        var html = '<span class="temp">' + f + '°F</span> ' + weatherLabel(c.weather_code) + ' · ' + cel + '°C · Acworth, GA';
        var els = qa('.weather');
        for (var i = 0; i < els.length; i++) { els[i].innerHTML = html; }
      } catch (e) {}
    });
  }

  function renderSlide(el, it, pos, total) {
    var photo = q('.photo', el);
    if (it.image) {
      photo.style.backgroundImage = 'url("' + it.image + '")';
      el.className = el.className.replace(/\bno-photo\b/g, '').replace(/\s+/g, ' ');
    } else {
      photo.style.backgroundImage = 'none';
      if (el.className.indexOf('no-photo') === -1) { el.className += ' no-photo'; }
    }
    q('.src', el).textContent = it.source.toUpperCase() + ' · ' + catLabel(it.category).toUpperCase();
    q('.headline', el).textContent = it.title;
    var t = fmtTime(it.published_at);
    q('.meta', el).textContent = t ? t + ' · ' + it.source : it.source;
    q('.counter', el).textContent = (pos + 1) + ' / ' + total;
  }

  function restartProgress() {
    var bar = document.getElementById('bar');
    bar.style.transition = 'none';
    bar.style.width = '0%';
    void bar.offsetWidth;
    bar.style.transition = 'width ' + ROTATE_MS + 'ms linear';
    bar.style.width = '100%';
  }

  function preloadNext() {
    if (!items.length) return;
    var next = items[(index + 1) % items.length];
    if (next && next.image) {
      var img = new Image();
      img.onerror = function () { next.image = ''; };
      img.src = next.image;
    }
  }

  function showSlide(i) {
    var next = current === 'A' ? 'B' : 'A';
    var el = slides[next];
    renderSlide(el, items[i], i, items.length);
    el.className = el.className.replace(/\bactive\b/g, '').replace(/\s+/g, ' ') + ' active';
    slides[current].className = slides[current].className.replace(/\bactive\b/g, '').replace(/\s+/g, ' ');
    current = next;
    restartProgress();
    preloadNext();
  }

  function showOffline() {
    document.body.className = 'offline';
  }

  function hideOffline() {
    document.body.className = document.body.className.replace(/\boffline\b/g, '').replace(/\s+/g, ' ');
  }

  function loadFromCache() {
    try {
      var cached = JSON.parse(localStorage.getItem('portalNewsCache') || 'null');
      if (cached && cached.items && cached.items.length) {
        items = cached.items;
        index = 0;
        showSlide(0);
        hideOffline();
        return true;
      }
    } catch (e) {}
    return false;
  }

  function scheduleRetry() {
    if (retryPending) return;
    retryPending = true;
    setTimeout(function () { retryPending = false; loadNews(); }, RETRY_MS);
  }

  function loadNews() {
    xhrGet(NEWS_URL + '?v=' + Math.floor(Date.now() / REFRESH_MS), function (err, txt) {
      if (!err) {
        try {
          var data = JSON.parse(txt);
          if (data.items && data.items.length) {
            var changed = !items.length || items[0].title !== data.items[0].title;
            items = data.items;
            if (index >= items.length) index = 0;
            try { localStorage.setItem('portalNewsCache', JSON.stringify({ saved_at: Date.now(), items: items })); } catch (e) {}
            hideOffline();
            if (changed) { showSlide(index); }
            return;
          }
        } catch (e) {}
      }
      if (!items.length && !loadFromCache()) {
        showOffline();
        scheduleRetry();
      }
    });
  }

  tickClock();
  setInterval(tickClock, 1000);
  loadWeather();
  setInterval(loadWeather, WEATHER_MS);
  loadNews();
  setInterval(loadNews, REFRESH_MS);
  setInterval(function () {
    if (items.length > 1) {
      index = (index + 1) % items.length;
      showSlide(index);
    }
  }, ROTATE_MS);
})();
</script>
</body>
</html>
